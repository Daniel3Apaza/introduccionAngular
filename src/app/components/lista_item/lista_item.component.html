<h2>Listado de personas</h2>

<table>
  <thead>
    <tr>
      <th>Correo</th>
      <th>Fecha de nacimiento</th>
      <th>Edad</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let persona of personas">
      <td>{{ persona.correo }}</td>
      <td>{{ persona.fechaNacimiento }}</td>
      <td>{{ persona.edad }}</td>
    </tr>
  </tbody>
</table>
